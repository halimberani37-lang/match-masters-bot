name: Match Masters Daily Publisher

on:
  schedule:
    - cron: '0 8 * * *' # يعمل تلقائياً كل يوم الساعة 8:00 صباحاً
  workflow_dispatch: # زر للتشغيل اليدوي للتجربة الفورية

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-setup@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        run: python main.py
